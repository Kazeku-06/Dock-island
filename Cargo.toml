[package]
name = "topdock"
version = "0.1.0"
edition = "2021"
authors = ["TopDock Team"]
description = "Dynamic Island productivity bar for Windows"
license = "MIT"

[dependencies]
# Windows API access
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media",
    "Win32_Storage_FileSystem",
    "Win32_System_Ole",
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "UI_Notifications",
] }

# Window creation and event handling
winit = "0.30"

# Rendering
wgpu = "22.1"
pollster = "0.3"

# Database
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime (untuk media session dan background tasks)
tokio = { version = "1.40", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# UI utilities
image = "0.25"
fontdue = "0.9"

[dev-dependencies]
tempfile = "3.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[[bin]]
name = "topdock"
path = "src/main.rs"
